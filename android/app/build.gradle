plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spacedrift.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.spacedrift.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "3.6.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.11.0'
}

// Automatically sync assets from ../src into assets folder before building
tasks.register('syncGameAssets', Copy) {
    from "${rootDir}/../src"
    into "${projectDir}/src/main/assets"
    // Exclude redundant dev artifacts if any
    exclude "**/*.tmp"
}

tasks.named('preBuild').configure {
    dependsOn syncGameAssets
}
